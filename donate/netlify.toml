# Netlify: این پوشه (donate) را به‌عنوان Base directory بدهید.
[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "REPORT_CHAT_ID,PAGE_URL"
